[env]
platform = https://github.com/maxgerhardt/platform-nordicnrf52
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
test_framework = doctest

[env:xiaonrf52840]
board = xiaoble_adafruit
framework = arduino
monitor_speed = 115200
extra_scripts = pre:patch_bluefruit.py

[env:native]
platform = native
build_flags = -std=gnu++17 -frtti
lib_deps = fabiobatsilva/ArduinoFake@^0.4.0
test_filter = native

[env:pic]
board = xiaoble_adafruit
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../pic/programmer.cpp>
build_flags = -std=gnu++17 -Ipic
extra_scripts = pre:pic/hex_to_header.py

